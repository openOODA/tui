name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc
          mkdir -p "$HOME/.openooda/bin" "$HOME/.openooda/lib" "$HOME/.openooda/oodar"
          GH=https://github.com/openOODA
          # oodac v0.2.70 still has the C backend. Later tags are LLVM-only
          # and cannot yet emit this harness (SSA + List[struct] gaps).
          curl -fsSL -o "$HOME/.openooda/bin/oodac" \
            "$GH/oodac/releases/download/v0.2.70/oodac-linux-x86_64"
          chmod +x "$HOME/.openooda/bin/oodac"
          curl -fsSL -o "$HOME/.openooda/lib/liboodar.a" \
            "$GH/oodar/releases/latest/download/liboodar.a-linux-x86_64"
          git clone --depth 1 https://github.com/openOODA/oodar.git "$HOME/.openooda/oodar"
          git clone --depth 1 https://github.com/openOODA/std.git "$HOME/.openooda/std"
          curl -fsSL -o "$HOME/.openooda/northstar.oot" \
            https://raw.githubusercontent.com/openOODA/openOODA/main/northstar.oot
          echo "$HOME/.openooda/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.openooda/bin/oodac"
          gcc --version | head -1

      - name: 256-line cap check (rules.oot §1.8)
        run: |
          set -e
          violations=0
          for f in $(find . -name "*.oo" -o -name "*.oot"); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 256 ]; then
              echo "FAIL: $f has $lines lines (> 256)"
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "FAIL: $violations files exceed 256-line cap"
            exit 1
          fi
          echo "PASS: 256-line cap holds"

      - name: File-type ban check (rules.oot §1.14)
        run: |
          set -e
          forbidden="py js ts rb pl json sh"
          for ext in $forbidden; do
            found=$(find . -name "*.$ext" -not -path "./.git/*" | grep -v "^./README.md$" || true)
            if [ -n "$found" ]; then
              echo "FAIL: forbidden file type .$ext found:"
              echo "$found"
              exit 1
            fi
          done
          echo "PASS: no forbidden file types"

      - name: Academy header check (rules.oot §1.11)
        run: |
          set -e
          failures=0
          for f in $(find . -name "*.oo"); do
            header=$(head -7 "$f")
            ok=1
            echo "$header" | grep -q "^// # " || ok=0
            echo "$header" | grep -q "^// Logline:" || ok=0
            echo "$header" | grep -q "^// Setup:" || ok=0
            echo "$header" | grep -q "^// Beats:" || ok=0
            if [ "$ok" -eq 0 ]; then
              echo "FAIL: $f missing Academy header in first 7 lines"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "FAIL: $failures files missing Academy header"
            exit 1
          fi
          echo "PASS: all .oo files have Academy headers"

      - name: oodac check (non-qa sources)
        run: |
          set -e
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_STD_ROOT="$HOME/.openooda/std"
          export OODA_FS_READDIR="$HOME/.openooda:${GITHUB_WORKSPACE}:/tmp"
          export OODA_FS_WRITEDIR="${GITHUB_WORKSPACE}:/tmp"
          export OODA_NO_JAIL=1
          for f in $(find . -name "*.oo" -not -path "./qa/*" -not -path "./.ooda-cache/*"); do
            echo "checking $f"
            "$OODA_COMPILER" check "$f" || exit 1
          done
          echo "PASS: oodac check holds"

      - name: Build
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_STD_ROOT="$HOME/.openooda/std"
          export OODA_FS_READDIR="$HOME/.openooda:${GITHUB_WORKSPACE}:/tmp:/usr"
          export OODA_FS_WRITEDIR="${GITHUB_WORKSPACE}:/tmp"
          export OODA_NO_JAIL=1
          rm -rf dist
          mkdir -p dist
          "$OODA_COMPILER" build --backend c main.oo -o dist/ooda-tui
          chmod +x dist/ooda-tui
          cp dist/ooda-tui dist/ooda-tui-linux-x86_64
          cp dist/ooda-tui dist/tui-linux-x86_64
          sha256sum dist/ooda-tui              | awk '{print $1}' > dist/ooda-tui.sha256
          sha256sum dist/ooda-tui-linux-x86_64 | awk '{print $1}' > dist/ooda-tui-linux-x86_64.sha256
          sha256sum dist/tui-linux-x86_64      | awk '{print $1}' > dist/tui-linux-x86_64.sha256
          ls -la dist/

      - name: Smoke test (--help, --version, --unknown-flag, --token, --no-color)
        run: |
          set -e
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_NO_JAIL=1
          ./dist/ooda-tui --help > /tmp/tui-help.txt
          grep -q "ooda-tui" /tmp/tui-help.txt
          ./dist/ooda-tui --version | grep -q "v0.1.3"
          set +e
          ./dist/ooda-tui --unknown-flag >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          ./dist/ooda-tui --token 2>/dev/null | grep -q subcommands
          printf '/exit\n' | NO_COLOR=1 ./dist/ooda-tui > /tmp/tui-nc.txt 2>&1 || true
          python3 -c "import pathlib; t=pathlib.Path('/tmp/tui-nc.txt').read_bytes(); assert t.count(b'\\x1b')==0, t.count(b'\\x1b')"
          printf '/help\n/exit\n' | ./dist/ooda-tui --no-color > /tmp/tui-help-slash.txt 2>&1 || true
          grep -q "commands:" /tmp/tui-help-slash.txt
          echo "PASS: smoke holds"

      - name: QA probes (compile only)
        run: |
          set -e
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_STD_ROOT="$HOME/.openooda/std"
          export OODA_NO_JAIL=1
          for f in $(find qa -name "*.oo"); do
            echo "checking $f"
            "$OODA_COMPILER" check "$f" || exit 1
          done
          echo "PASS: qa probes compile"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ooda-tui-linux
          path: |
            dist/ooda-tui
            dist/ooda-tui.sha256
            dist/ooda-tui-linux-x86_64
            dist/ooda-tui-linux-x86_64.sha256
            dist/tui-linux-x86_64
            dist/tui-linux-x86_64.sha256

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@main
    with:
      artifact_pattern: ooda-tui-*
    permissions:
      contents: write
