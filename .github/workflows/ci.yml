name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout tui
        uses: actions/checkout@v4
        with:
          path: tui

      - name: Checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std

      - name: Checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar

      - name: Checkout ooda
        uses: actions/checkout@v4
        with:
          repository: openOODA/ooda
          path: ooda

      - name: Checkout cli
        uses: actions/checkout@v4
        with:
          repository: openOODA/cli
          path: cli

      - name: Checkout lsp
        uses: actions/checkout@v4
        with:
          repository: openOODA/lsp
          path: lsp

      - name: Checkout mcp
        uses: actions/checkout@v4
        with:
          repository: openOODA/mcp
          path: mcp

      - name: Checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          mkdir -p "$HOME/.openooda/bin" "$HOME/.openooda/lib"
          GH=https://github.com/openOODA
          # Pinned toolchain: hash-verified before chmod (a replaced release
          # asset fails closed). Bump version + hash together, deliberately.
          OODAC_SHA256="0ac6f321bf0b7eea20bf3b827df849557de2d3a1b869888edcbd17e81a8244e5"
          curl -fsSL -o "$HOME/.openooda/bin/oodac" \
            "$GH/oodac/releases/download/v0.11.31/oodac-linux-x86_64"
          echo "$OODAC_SHA256  $HOME/.openooda/bin/oodac" | sha256sum -c -
          chmod +x "$HOME/.openooda/bin/oodac"
          # northstar pinned to a commit (master-floating fetched whatever was
          # newest); hash assert guards transport. Bump both together.
          NORTHSTAR_SHA="adfd86a19e4e471c4e82578c6696fe4a08b4100e"
          NORTHSTAR_SHA256="eb3e36e9154220418f9d37dce2414ebaf3d39f7755967e6114ad1670be704ea3"
          curl -fsSL -o "$HOME/.openooda/northstar.oot" \
            "https://raw.githubusercontent.com/openOODA/openOODA/${NORTHSTAR_SHA}/northstar.oot"
          echo "$NORTHSTAR_SHA256  $HOME/.openooda/northstar.oot" | sha256sum -c -
          echo "$HOME/.openooda/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.openooda/bin/oodac"
          test -f "$GITHUB_WORKSPACE/std/fs/process/env.oo"
          test -f "$GITHUB_WORKSPACE/oodar/oodar.c"
          clang --version | head -1

      - name: Build oodar libs
        run: make -C oodar/scripts -f Makefile modular

      - name: Build ooda, cli, lsp, mcp drivers
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          # NOTE: no OODA_STD — oodac ignores it. std/ imports resolve by
          # workspace path walk (oodac ast/load_import_parse.oo).
          export OODA_NO_JAIL=1
          "$OODA_COMPILER" build ooda/main.oo -o "$HOME/.openooda/bin/ooda"
          chmod +x "$HOME/.openooda/bin/ooda"
          "$OODA_COMPILER" build cli/main.oo -o "$HOME/.openooda/bin/cli"
          chmod +x "$HOME/.openooda/bin/cli"
          "$OODA_COMPILER" build lsp/cli/main.oo -o "$HOME/.openooda/bin/lsp"
          chmod +x "$HOME/.openooda/bin/lsp"
          "$OODA_COMPILER" build mcp/cli/main.oo -o "$HOME/.openooda/bin/mcp"
          chmod +x "$HOME/.openooda/bin/mcp"
          "$HOME/.openooda/bin/ooda" version

      - name: Structural verification (rules.oot §1.8/§1.11/§1.14)
        working-directory: tui
        run: make line-cap file-law academy

      - name: Check
        working-directory: tui
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_NO_JAIL=1
          unset OODA_FS_READDIR OODA_FS_WRITEDIR || true
          mkdir -p dist .ooda-cache/ooda-tmp
          "$OODA_COMPILER" check main.oo

      - name: Build tui (LLVM)
        working-directory: tui
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=8589934592
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_NO_JAIL=1
          mkdir -p dist
          "$OODA_COMPILER" build --backend llvm main.oo -o dist/tui
          chmod +x dist/tui
          cp dist/tui dist/tui-linux-x86_64
          sha256sum dist/tui                | awk '{print $1}' > dist/tui.sha256
          sha256sum dist/tui-linux-x86_64   | awk '{print $1}' > dist/tui-linux-x86_64.sha256
          ls -la dist/

      - name: Smoke test (--help, --version, --unknown-flag, --token, --no-color)
        working-directory: tui
        run: |
          set -e
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_NO_JAIL=1
          ./dist/tui --help > /tmp/tui-help.txt
          grep -q "^tui " /tmp/tui-help.txt
          ./dist/tui --version | grep -q "^tui "
          set +e
          ./dist/tui --unknown-flag >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          ./dist/tui --token 2>/dev/null | grep -q subcommands
          printf '/exit\n' | ./dist/tui --no-color > /tmp/tui-nc.txt 2>&1 || true
          python3 -c "import pathlib; t=pathlib.Path('/tmp/tui-nc.txt').read_bytes(); assert t.count(bytes([0x1b]))==0, t.count(bytes([0x1b]))"
          printf '/help\n/exit\n' | ./dist/tui --no-color > /tmp/tui-help-slash.txt 2>&1 || true
          grep -q "commands:" /tmp/tui-help-slash.txt
          echo "PASS: smoke holds"

      - name: QA probes (check all, execute runnable)
        working-directory: tui
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_STD_ROOT="$GITHUB_WORKSPACE/std"
          export OODA_NO_JAIL=1
          export OODA_TUI_ROOT="$GITHUB_WORKSPACE/tui"
          export OODA_HOME="$HOME"
          export PATH="$HOME/.openooda/bin:$PATH"
          for f in $(find qa -name "*.oo"); do
            echo "checking $f"
            "$OODA_COMPILER" check "$f" || exit 1
          done
          echo "PASS: qa probes compile"
          # Execute every runnable probe. e2e_tier* and e2e_master run under
          # `make e2e` (post-install: tier parity checks need the installed
          # binary); anchor.oo is structural (no main). dist/tui was built above.
          for f in $(find qa -name "*.oo" -not -path "*/e2e/*" -not -name "anchor.oo" -not -name "suite.oo"); do
            echo "testing $f"
            ooda test "$f" || exit 1
          done
          echo "PASS: qa probes execute"

      - name: E2E suite (138 tests, double-run)
        working-directory: tui
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_NO_JAIL=1
          export OODA_TUI_ROOT="$GITHUB_WORKSPACE/tui"
          export OODA_HOME="$HOME"
          export PATH="$HOME/.openooda/bin:$PATH"
          make install
          make e2e

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-linux
          path: |
            tui/dist/tui
            tui/dist/tui.sha256
            tui/dist/tui-linux-x86_64
            tui/dist/tui-linux-x86_64.sha256

  release:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
    with:
      artifact_pattern: tui-*
    permissions:
      contents: write
