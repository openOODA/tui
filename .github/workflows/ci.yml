name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          curl -fsSL https://openooda.org/install.sh | bash
          echo "$HOME/.openooda/bin" >> "$GITHUB_PATH"

      - name: 256-line cap check (rules.oot §1.8)
        run: |
          set -e
          violations=0
          for f in $(find . -name "*.oo" -o -name "*.oot"); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 256 ]; then
              echo "FAIL: $f has $lines lines (> 256)"
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "FAIL: $violations files exceed 256-line cap"
            exit 1
          fi
          echo "PASS: 256-line cap holds"

      - name: File-type ban check (rules.oot §1.14)
        run: |
          set -e
          forbidden="py js ts rb pl json sh"
          for ext in $forbidden; do
            found=$(find . -name "*.$ext" -not -path "./.git/*" | grep -v "^./README.md$" || true)
            if [ -n "$found" ]; then
              echo "FAIL: forbidden file type .$ext found:"
              echo "$found"
              exit 1
            fi
          done
          echo "PASS: no forbidden file types"

      - name: Academy header check (rules.oot §1.11)
        run: |
          set -e
          failures=0
          for f in $(find . -name "*.oo"); do
            line1=$(sed -n '1p' "$f")
            line2=$(sed -n '2p' "$f")
            line3=$(sed -n '3p' "$f")
            line4=$(sed -n '4p' "$f")
            if [[ "$line1" != "// # "* ]]; then
              echo "FAIL: $f line 1 is not '// # <Title>'"
              failures=$((failures + 1))
            fi
            if [[ "$line2" != "// Logline:"* ]]; then
              echo "FAIL: $f line 2 is not '// Logline: ...'"
              failures=$((failures + 1))
            fi
            if [[ "$line3" != "// Setup:"* ]]; then
              echo "FAIL: $f line 3 is not '// Setup: ...'"
              failures=$((failures + 1))
            fi
            if [[ "$line4" != "// Beats:"* ]]; then
              echo "FAIL: $f line 4 is not '// Beats:'"
              failures=$((failures + 1))
            fi
          done
          if [ "$failations" -gt 0 ]; then
            echo "FAIL: $failures files missing Academy header"
            exit 1
          fi
          echo "PASS: all .oo files have Academy headers"

      - name: oodac check (non-qa sources)
        run: |
          set -e
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$(pwd)/help.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          for f in $(find . -name "*.oo" -not -path "./qa/*" -not -path "./.ooda-cache/*"); do
            echo "checking $f"
            "$OODA_COMPILER" check "$f" || exit 1
          done
          echo "PASS: oodac check holds"

      - name: Build
        run: |
          set -e
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$(pwd)/help.oot"
          ooda build main.oo -o dist/ooda-tui
          ls -la dist/
          sha256sum dist/ooda-tui > dist/ooda-tui.sha256

      - name: Smoke test (--help, --version, --unknown-flag)
        run: |
          set -e
          export OODACODEX="$(pwd)/help.oot"
          ./dist/ooda-tui --help > /dev/null
          ./dist/ooda-tui --version > /dev/null
          ./dist/ooda-tui --unknown-flag 2>/dev/null
          test $? -eq 2
          echo "PASS: smoke holds"

      - name: QA probes (compile only)
        run: |
          set -e
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$(pwd)/help.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          for f in $(find qa -name "*.oo"); do
            echo "checking $f"
            "$OODA_COMPILER" check "$f" || exit 1
          done
          echo "PASS: qa probes compile"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ooda-tui
          path: |
            dist/ooda-tui
            dist/ooda-tui.sha256

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@main
    with:
      artifact_pattern: ooda-tui-*
    permissions:
      contents: write
