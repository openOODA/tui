name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout tui
        uses: actions/checkout@v4
        with:
          path: tui

      - name: Checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std

      - name: Checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar

      - name: Checkout ooda
        uses: actions/checkout@v4
        with:
          repository: openOODA/ooda
          path: ooda

      - name: Checkout cli
        uses: actions/checkout@v4
        with:
          repository: openOODA/cli
          path: cli

      - name: Checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          mkdir -p "$HOME/.openooda/bin" "$HOME/.openooda/lib"
          GH=https://github.com/openOODA
          curl -fsSL -o "$HOME/.openooda/bin/oodac" \
            "$GH/oodac/releases/download/v0.11.15/oodac-linux-x86_64"
          chmod +x "$HOME/.openooda/bin/oodac"
          curl -fsSL -o "$HOME/.openooda/northstar.oot" \
            https://raw.githubusercontent.com/openOODA/openOODA/master/northstar.oot
          echo "$HOME/.openooda/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.openooda/bin/oodac"
          test -f "$GITHUB_WORKSPACE/std/fs/process/env.oo"
          test -f "$GITHUB_WORKSPACE/oodar/oodar.c"
          clang --version | head -1

      - name: Build oodar libs
        run: make -C oodar/scripts -f Makefile modular

      - name: Build ooda and cli drivers
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_STD="$GITHUB_WORKSPACE/std"
          export OODA_NO_JAIL=1
          "$OODA_COMPILER" build ooda/main.oo -o "$HOME/.openooda/bin/ooda"
          chmod +x "$HOME/.openooda/bin/ooda"
          "$OODA_COMPILER" build cli/main.oo -o "$HOME/.openooda/bin/cli"
          chmod +x "$HOME/.openooda/bin/cli"
          "$HOME/.openooda/bin/ooda" version

      - name: 256-line cap check (rules.oot §1.8)
        working-directory: tui
        run: |
          set -e
          violations=0
          for f in $(find . -name "*.oo" -o -name "*.oot"); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 256 ]; then
              echo "FAIL: $f has $lines lines (> 256)"
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "FAIL: $violations files exceed 256-line cap"
            exit 1
          fi
          echo "PASS: 256-line cap holds"

      - name: File-type ban check (rules.oot §1.14)
        working-directory: tui
        run: |
          set -e
          forbidden="py js ts rb pl json sh"
          for ext in $forbidden; do
            found=$(find . -name "*.$ext" -not -path "./.git/*" | grep -v "^./README.md$" || true)
            if [ -n "$found" ]; then
              echo "FAIL: forbidden file type .$ext found:"
              echo "$found"
              exit 1
            fi
          done
          echo "PASS: no forbidden file types"

      - name: Academy header check (rules.oot §1.11)
        working-directory: tui
        run: |
          set -e
          failures=0
          for f in $(find . -name "*.oo"); do
            header=$(head -7 "$f")
            ok=1
            echo "$header" | grep -q "^// # " || ok=0
            echo "$header" | grep -q "^// Logline:" || ok=0
            echo "$header" | grep -q "^// Setup:" || ok=0
            echo "$header" | grep -q "^// Beats:" || ok=0
            if [ "$ok" -eq 0 ]; then
              echo "FAIL: $f missing Academy header in first 7 lines"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "FAIL: $failures files missing Academy header"
            exit 1
          fi
          echo "PASS: all .oo files have Academy headers"

      - name: Check
        working-directory: tui
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_STD="$GITHUB_WORKSPACE/std"
          export OODA_NO_JAIL=1
          unset OODA_FS_READDIR OODA_FS_WRITEDIR || true
          mkdir -p dist .ooda-cache/ooda-tmp
          "$OODA_COMPILER" check main.oo

      - name: Build ooda-tui (LLVM)
        working-directory: tui
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=8589934592
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_NO_JAIL=1
          mkdir -p dist
          "$OODA_COMPILER" build --backend llvm main.oo -o dist/ooda-tui
          chmod +x dist/ooda-tui
          cp dist/ooda-tui dist/ooda-tui-linux-x86_64
          cp dist/ooda-tui dist/tui-linux-x86_64
          sha256sum dist/ooda-tui              | awk '{print $1}' > dist/ooda-tui.sha256
          sha256sum dist/ooda-tui-linux-x86_64 | awk '{print $1}' > dist/ooda-tui-linux-x86_64.sha256
          sha256sum dist/tui-linux-x86_64      | awk '{print $1}' > dist/tui-linux-x86_64.sha256
          ls -la dist/

      - name: Smoke test (--help, --version, --unknown-flag, --token, --no-color)
        working-directory: tui
        run: |
          set -e
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_NO_JAIL=1
          ./dist/ooda-tui --help > /tmp/tui-help.txt
          grep -q "ooda-tui" /tmp/tui-help.txt
          ./dist/ooda-tui --version | grep -q "ooda-tui"
          set +e
          ./dist/ooda-tui --unknown-flag >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          ./dist/ooda-tui --token 2>/dev/null | grep -q subcommands
          printf '/exit\n' | ./dist/ooda-tui --no-color > /tmp/tui-nc.txt 2>&1 || true
          python3 -c "import pathlib; t=pathlib.Path('/tmp/tui-nc.txt').read_bytes(); assert t.count(bytes([0x1b]))==0, t.count(bytes([0x1b]))"
          printf '/help\n/exit\n' | ./dist/ooda-tui --no-color > /tmp/tui-help-slash.txt 2>&1 || true
          grep -q "commands:" /tmp/tui-help-slash.txt
          echo "PASS: smoke holds"

      - name: QA probes (compile only)
        working-directory: tui
        run: |
          set -e
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_STD="$GITHUB_WORKSPACE/std"
          export OODA_STD_ROOT="$GITHUB_WORKSPACE/std"
          export OODA_NO_JAIL=1
          # Only the v0.1.3 live-path probes. Scaffold leftovers still
          # reference int_to_str without a local stub (oodac v0.2.66).
          for f in qa/probe_chrome.oo qa/probe_slash.oo qa/theme_color_session.oo qa/render.oo qa/theme_swap.oo; do
            echo "checking $f"
            "$OODA_COMPILER" check "$f" || exit 1
          done
          echo "PASS: qa probes compile"

      - name: E2E suite (138 tests, double-run)
        working-directory: tui
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          export OODA_STD="$GITHUB_WORKSPACE/std"
          export OODA_NO_JAIL=1
          export OODA_TUI_ROOT="$GITHUB_WORKSPACE/tui"
          export OODA_HOME="$HOME"
          export PATH="$HOME/.openooda/bin:$PATH"
          make install
          make e2e

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ooda-tui-linux
          path: |
            tui/dist/ooda-tui
            tui/dist/ooda-tui.sha256
            tui/dist/ooda-tui-linux-x86_64
            tui/dist/ooda-tui-linux-x86_64.sha256
            tui/dist/tui-linux-x86_64
            tui/dist/tui-linux-x86_64.sha256

  release:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@master
    with:
      artifact_pattern: ooda-tui-*
    permissions:
      contents: write
